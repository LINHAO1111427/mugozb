(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const ids = ['page','rear-wheel','front-wheel','pelican','rear-leg','front-leg','front-leg-outline','rear-foot','front-foot','crank','chain','cloud-a','cloud-b','cloud-c','sea-ripples','road-marks','passing-sign','back-plants','front-plants','sailboat','shoreline','eye','scarf-tail-back','scarf-tail-front','bike-bell','bell-caption','play-button','play-icon','play-label','ride-state','speed','speed-value','bell-button'];
  const nodes = Object.fromEntries(ids.map(id => [id, byId(id)]));
  let paused = false, speed = 1, elapsed = 0, previousTime = null, bellUntil = 0, audioContext = null;
  const tau = Math.PI * 2;
  const crank = {x:644, y:606, radius:38};
  const set = (node, attribute, value) => node.setAttribute(attribute, value);

  // Two-segment legs keep the webbed feet attached to the rotating pedals.
  function legPath(hip, foot, direction) {
    const upper = 108, lower = 112;
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    const distance = Math.max(.001, Math.hypot(dx, dy));
    const projection = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const height = Math.sqrt(Math.max(0, upper * upper - projection * projection));
    const kneeX = hip.x + dx / distance * projection - dy / distance * height * direction;
    const kneeY = hip.y + dy / distance * projection + dx / distance * height * direction;
    return `M${hip.x} ${hip.y}L${kneeX} ${kneeY}L${foot.x} ${foot.y}`;
  }

  function draw(time, now) {
    const angle = time * tau * .64;
    const degrees = angle * 180 / Math.PI;
    const travel = angle * 1.85 * 110;
    const bob = Math.sin(angle * 2) * 2.2;
    const front = {x:crank.x + Math.cos(angle) * crank.radius, y:crank.y + Math.sin(angle) * crank.radius};
    const rear = {x:crank.x - Math.cos(angle) * crank.radius, y:crank.y - Math.sin(angle) * crank.radius};
    set(nodes['rear-wheel'], 'transform', `rotate(${degrees * 1.85 % 360})`);
    set(nodes['front-wheel'], 'transform', `rotate(${degrees * 1.85 % 360})`);
    set(nodes.pelican, 'transform', `translate(0 ${bob})`);
    set(nodes['rear-leg'], 'd', legPath({x:602,y:445 + bob}, {x:rear.x,y:rear.y-9}, -1));
    const frontLeg = legPath({x:622,y:442 + bob}, {x:front.x,y:front.y-11}, 1);
    set(nodes['front-leg'], 'd', frontLeg);
    set(nodes['front-leg-outline'], 'd', frontLeg);
    set(nodes['front-foot'], 'transform', `translate(${front.x} ${front.y - 11})`);
    set(nodes['rear-foot'], 'transform', `translate(${rear.x} ${rear.y - 9})`);
    set(nodes.crank, 'd', `M${rear.x} ${rear.y}L${front.x} ${front.y}`);
    set(nodes.chain, 'stroke-dashoffset', -travel * .2 % 8);
    set(nodes['road-marks'], 'patternTransform', `translate(${-travel % 180} 0)`);
    set(nodes['sea-ripples'], 'patternTransform', `translate(${-travel * .12 % 230} ${Math.sin(time * .7) * 2})`);
    [['cloud-a',171,156,1.45],['cloud-b',603,91,.78],['cloud-c',1196,286,.92]].forEach(([id,x,y,scale]) => {
      const position = ((x + 260 - travel * .035) % 1760 + 1760) % 1760 - 260;
      set(nodes[id], 'transform', `translate(${position} ${y}) scale(${scale})`);
    });
    const signPosition = ((1220 + 160 - travel * .38) % 1800 + 1800) % 1800 - 160;
    set(nodes['passing-sign'], 'transform', `translate(${signPosition} 0)`);
    set(nodes['back-plants'], 'transform', `translate(${-travel * .18 % 1560} 0)`);
    set(nodes['front-plants'], 'transform', `translate(${-travel * .72 % 1560} 0)`);
    set(nodes.sailboat, 'transform', `translate(${1180 - Math.sin(time * .045) * 60} ${445 + Math.sin(time * 1.1) * 2}) rotate(${Math.sin(time * .85) * 2})`);
    set(nodes.shoreline, 'opacity', .7 + Math.sin(time * 1.5) * .15);
    const flutter = Math.sin(angle * 1.8);
    set(nodes['scarf-tail-back'], 'd', `M704 321Q636 ${291 + flutter * 10} 593 ${321 + flutter * 8}l-28-10 7 26q61-17 128 5Z`);
    set(nodes['scarf-tail-front'], 'd', `M698 328q-37 ${37 + flutter * 5}-94 ${24 + flutter * 8}l-28 15 8-24q58 13 99-23Z`);
    const blink = time % 5.7;
    const openness = blink > 5.42 && blink < 5.6 ? .13 : 1;
    set(nodes.eye, 'transform', `translate(0 ${244 * (1 - openness)}) scale(1 ${openness})`);
    const ringing = now < bellUntil;
    nodes['bell-caption'].classList.toggle('visible', ringing);
    set(nodes['bike-bell'], 'transform', `translate(810 402) rotate(${ringing ? Math.sin(now * .07) * 13 : 0})`);
  }

  function frame(now) {
    const delta = previousTime === null ? 0 : Math.min((now - previousTime) / 1000, .06);
    previousTime = now;
    if (!paused) elapsed += delta * speed;
    draw(elapsed, now);
    requestAnimationFrame(frame);
  }
  function togglePlayback() {
    paused = !paused;
    nodes.page.classList.toggle('paused', paused);
    nodes['play-button'].setAttribute('aria-pressed', String(paused));
    nodes['play-button'].setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
    nodes['play-label'].textContent = paused ? '继续兜风' : '歇一会儿';
    nodes['ride-state'].textContent = paused ? '停下来，看看这片海' : '正在收集沿途的海风';
    set(nodes['play-icon'], 'd', paused ? 'M7 4l9 6-9 6Z' : 'M7 5v10M13 5v10');
  }
  async function ringBell() {
    bellUntil = performance.now() + 1300;
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    try {
      audioContext ||= new Audio();
      if (audioContext.state === 'suspended') await audioContext.resume();
      const start = audioContext.currentTime;
      [0,.14].forEach(offset => {
        [1550,2350,3270].forEach((frequency,index) => {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = 'sine'; oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(0, start + offset);
          gain.gain.linearRampToValueAtTime(.055 / (index + 1), start + offset + .004);
          gain.gain.exponentialRampToValueAtTime(.0001, start + offset + .65);
          oscillator.connect(gain); gain.connect(audioContext.destination);
          oscillator.start(start + offset); oscillator.stop(start + offset + .7);
          oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
        });
      });
    } catch (_) { /* The visible bell still works if sound is unavailable. */ }
  }
  nodes['play-button'].addEventListener('click', togglePlayback);
  nodes['bell-button'].addEventListener('click', ringBell);
  nodes.speed.addEventListener('input', event => {
    speed = Number(event.target.value);
    nodes['speed-value'].textContent = `${speed.toFixed(2).replace(/0$/, '')}×`;
  });
  document.addEventListener('visibilitychange', () => { previousTime = null; });
  document.addEventListener('keydown', event => {
    if (event.code === 'Space' && !['INPUT','BUTTON','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
      event.preventDefault(); togglePlayback();
    }
  });
  // Duplicate planting strips for a seamless, endlessly scrolling coast.
  for (const id of ['back-plants','front-plants']) {
    const strip = nodes[id];
    const duplicate = document.createElementNS('http://www.w3.org/2000/svg','g');
    duplicate.setAttribute('transform','translate(1560 0)');
    [...strip.children].forEach(child => duplicate.appendChild(child.cloneNode(true)));
    strip.appendChild(duplicate);
  }
  draw(0, 0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
